---
layout: default
title: Blog Post Clustering
---

<div class="clustering-container">
    <h1>Blog Post Clustering</h1>
    <p>Use the slider below to adjust the number of clusters and click "Cluster Posts" to group similar blog posts together.</p>
    
    <div class="controls">
        <div class="slider-container">
            <label for="cluster-slider">Number of Clusters:</label>
            <input type="range" id="cluster-slider" min="2" max="10" value="5">
            <span id="cluster-value">5</span>
        </div>
        <button id="cluster-btn" class="btn">Cluster Posts</button>
    </div>
    
    <div id="loading" style="display: none;">
        <div class="spinner"></div>
        <p>Clustering posts...</p>
    </div>
    
    <div id="clusters"></div>
</div>

<script src="/assets/js/clustering.js"></script>
<script>
    // Set the API base URL for development
    document.documentElement.dataset.apiBaseUrl = 'http://localhost:5050';
</script>

<style>
